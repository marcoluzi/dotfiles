- cask:
  - slack

- shell:
  - [sudo scutil --set ComputerName "Marco's MacBook Pro (2023)", Setting ComputerName]
  - [sudo scutil --set HostName "marco-mbp23", Setting HostName]
  - [sudo scutil --set LocalHostName "Marco-MBP23", Setting LocalHostName]
  - [chmod go-w "/opt/homebrew/share", Fixing permissions on /opt/homebrew/share]
  - [chmod -R go-w "/opt/homebrew/share/zsh", Fixing permissions on /opt/homebrew/share/zsh]
