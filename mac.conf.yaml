- defaults:
    clean:
      force: true
    link:
      create: true
      relink: true
      force: true

- clean: ['~', '~/.config']

- shell:
    - [git submodule update --init --recursive, Running git submodule update]

- link:
    ~/.dotfiles: .
    ~/.gitconfig: home/gitconfig
    ~/.p10k.zsh: home/p10k.zsh
    ~/.zprofile: home/zprofile
    ~/.zshenv: home/zshenv
    ~/.zshrc: home/zshrc
    ~/.config/alacritty/alacritty.toml: config/alacritty/alacritty.toml
    ~/.config/zsh: config/zsh
    ~/.config/nvim: kickstart.nvim
    ~/Library/Application Support/Code/User/settings.json: config/vscode/settings.json

- brew:
  - coreutils
  - gh
  - ghq
  - git
  - mkcert
  - nss
  - nvim
  - openssh
  - powerlevel10k
  - rsync
  - tldr

- cask:
  - alacritty
  - aldente
  - alfred
  - bartender
  - chromium
  - cleanmymac
  - docker
  - dropbox
  - firefox
  - font-fira-code-nerd-font
  - obsidian
  - rectangle
  - visual-studio-code

- shell:
  -
    command: curl -fsSL https://raw.githubusercontent.com/rmmgc/vscode-extensions-bulk-install/main/bulk-install.sh | sh -s ~/.dotfiles/vscodefile.txt
    stdin: true
    stdout: true
    description: Installing vscode extensions
    quiet: true
  - [sudo mkdir -p /etc/resolver]
  - [echo "nameserver 127.0.0.1" | sudo tee -a /etc/resolver/lan > /dev/null]
  - [echo "nameserver 127.0.0.1" | sudo tee -a /etc/resolver/test > /dev/null]
  - [mkcert -install, Setting up the local Root CA]
