- defaults:
    clean:
      force: true
    link:
      create: true
      relink: true
      force: true

- clean: ['~', '~/.config']

- shell:
    - [git submodule update --init --recursive, Running git submodule update]

- link:
    ~/.dotfiles: .
    ~/.gitconfig: home/gitconfig
    ~/.p10k.zsh: home/p10k.zsh
    ~/.zprofile: home/zprofile
    ~/.zshenv: home/zshenv
    ~/.zshrc: home/zshrc
    ~/.config/alacritty/alacritty.toml: config/alacritty/alacritty.toml
    ~/.config/zsh: config/zsh
    ~/.config/nvim: kickstart.nvim

- brew:
  - coreutils
  - font-meslo-for-powerlevel10k
  - gh
  - ghq
  - git
  - nvim
  - openssh
  - powerlevel10k

- cask:
  - alacritty
  - aldente
  - alfred
  - bartender
  - brave-browser
  - dropbox
  - firefox
  - obsidian
  - rectangle
  - spotify
  - visual-studio-code
  - 1password
