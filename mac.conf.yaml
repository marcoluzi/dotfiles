- defaults:
    clean:
      force: true
    link:
      create: true
      relink: true
      force: true

- clean: ['~', '~/.config']

- shell:
    - [git submodule update --init --recursive, Running git submodule update]

- link:
    ~/.dotfiles: .
    ~/.gitconfig: home/gitconfig
    ~/.p10k.zsh: home/p10k.zsh
    ~/.zprofile: home/zprofile
    ~/.zshenv: home/zshenv
    ~/.zshrc: home/zshrc
    ~/.config/alacritty/alacritty.toml: config/alacritty/alacritty.toml
    ~/.config/zsh: config/zsh
    ~/.config/nvim: kickstart.nvim
    ~/Library/Application Support/Windsurf/User/settings.json: config/windsurf/settings.json

- brew:
  - coreutils
  - gh
  - ghq
  - git
  - nvim
  - openssh
  - powerlevel10k
  - rsync
  - tldr

- cask:
  - alacritty
  - aldente
  - alfred
  - bartender
  - cleanmymac
  - docker
  - dropbox
  - firefox
  - font-fira-code-nerd-font
  - google-chrome
  - obsidian
  - rectangle
  - windsurf

- shell:
  - [mkdir -p ~/.cache/zsh/completions]
