# Wallpaper Manager
exec-once=swww-daemon
exec-once=~/.config/hypr/swww/scripts/swww_randomizer.sh

# Waybar
exec-once=waybar

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 3
    col.active_border = 0xffe0a96d    # soft orange
    col.inactive_border = 0xff1e1e2e  # dark violet
}

decoration {
    rounding = 15

    shadow {
        enabled = false
        range = 100
        render_power = 5
        color = 0x331e1e2e         # dark violet shadow
        color_inactive = 0x221e1e2e
    }

    blur {
        enabled = no
    }
}

animations {
    enabled = 1
    bezier = overshot,0.13,0.99,0.29,1.1
    animation = windows,1,4,overshot,slide
    animation = border,1,3,default
    animation = fade,1,3,default
    animation = workspaces,1,6,overshot,slide
}
