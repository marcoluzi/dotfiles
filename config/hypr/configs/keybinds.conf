# Keybinds for triggering applications and performing various action
# Change them as you see fit
# See more at : https://wiki.hyprland.org/Configuring/Binds/
# If you're confused over "bindl", "bindle" etc. I suggest visiting and giving wiki a read

# Set programs that you use below

$mainMod = SUPER
$terminal = uwsm app -- kitty
$fileManager = uwsm app -- flatpak run org.kde.dolphin
$menu = uwsm app -- rofi -show drun -theme $HOME/.config/rofi/type1.rasi -click-to-exit
$window = uwsm app -- rofi -show window -theme $HOME/.config/rofi/type1.rasi -click-to-exit
$browser = uwsm app -- flatpak run com.brave.Browser
$scripts = $HOME/.local/scripts/
$hyp_script = $HOME/.config/hypr/scripts/

###################
### MOUSE BINDS ###
###################

bind = $mainMod , mouse_down, workspace, e+1
bind = $mainMod , mouse_up, workspace, e-1
bindm= $mainMod , mouse:272, movewindow
bindm = $mainMod , mouse:273, resizewindow

####################
### LAPTOP BINDS ###
####################

bindle = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5 
bindle = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -5
bindle = , xf86audiomute, exec, swayosd-client --output-volume mute-toggle
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86Calculator, exec, QT_QPA_PLATFORMTHEME=qt5ct kcalc
bindl = , XF86AudioMedia, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec,  playerctl play-pause
bindl = , XF86AudioStop,  exec,  playerctl stop
bindl = , XF86AudioPrev,  exec,  playerctl previous
bindl = , XF86AudioNext,  exec,  playerctl next
bind = $mainMod, M, exec, swayosd-client --input-volume mute-toggle

####################
### APPLICATIONS ###
####################

bind = $mainMod , Return, exec, $terminal 
bind = $mainMod , Space, exec, pkill rofi || $menu
bind = ALT , Space, exec, pkill rofi || $window
bind = $mainMod , B, exec, $browser
bind = $mainMod , E, exec, $fileManager
bind = $mainMod CONTROL, L, exec, hyprlock

##################
### WORKSPACES ###
##################

bind = $mainMod , U, focusurgentorlast
bind = $mainMod , I, exec, $hyp_script/ChangeLayout

bind = $mainMod , S, togglefloating,
bind = $mainMod , A, exec, bash -c "if hyprctl activewindow | grep 'floating: 0'; then hyprctl dispatch togglefloating active; fi; hyprctl dispatch pin active"
bind = $mainMod , Q, killactive

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod CONTROL, 1, movetoworkspace, 1
bind = $mainMod CONTROL, 2, movetoworkspace, 2
bind = $mainMod CONTROL, 3, movetoworkspace, 3
bind = $mainMod CONTROL, 4, movetoworkspace, 4
bind = $mainMod CONTROL, 5, movetoworkspace, 5
bind = $mainMod CONTROL, 6, movetoworkspace, 6
bind = $mainMod CONTROL, 7, movetoworkspace, 7
bind = $mainMod CONTROL, 8, movetoworkspace, 8
bind = $mainMod CONTROL, 9, movetoworkspace, 9
bind = $mainMod CONTROL, 0, movetoworkspace, 10

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

bindr = $mainMod , left, movefocus, l
bindr = $mainMod , right, movefocus, r
bindr = $mainMod , up, movefocus, u
bindr = $mainMod , down, movefocus, d
bindr = $mainMod SHIFT, left, movewindow, l
bindr = $mainMod SHIFT, right, movewindow, r
bindr = $mainMod SHIFT, up, movewindow, u
bindr = $mainMod SHIFT, down, movewindow, d
bindr = $mainMod CONTROL, up, focusmonitor, l
bindr = $mainMod CONTROL, down, focusmonitor, r
bindr = $mainMod ALT, left, splitratio, -0.1
bindr = $mainMod ALT, right, splitratio, +0.1

bind = $mainMod , section, togglespecialworkspace, 
bind = ALT, section, movetoworkspace, special
bind = $mainMod, G, workspace, name:games

#mimic monocle mode from BSPWM 
bind = $mainMod , backslash , fullscreen, 1
bind = $mainMod , F, fullscreen, 0

###################
### POWER STUFF ###
###################
bind = $mainMod SHIFT, Q, exec, shutdown now
bind = $mainMod SHIFT, R,  exec, reboot
bind = $mainMod CONTROL, Q, exit
